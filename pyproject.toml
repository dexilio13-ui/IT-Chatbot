[project]
name = "chatbot-app"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "llama-index-core>=0.14.23",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-retrievers-bm25>=0.5.0",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "llama-index-readers-file>=0.4.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "docx2txt>=0.9",
    "python-pptx>=1.0.2",
    "bcrypt>=4.3.0",
    "llama-index-llms-openai>=0.6.26",
    "llama-parse>=0.6.94",
    "gradio>=5.0,<6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
[[tool.mypy.overrides]]
module = "llama_index.*"
ignore_missing_imports = true
